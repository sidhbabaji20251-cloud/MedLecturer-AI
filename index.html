    <!-- Service Worker Registration & Cache Busting -->
    <script>
      // Force unregister stale service workers to load the updated layout engine instantly!
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (const registration of registrations) {
            registration.unregister().then(() => {
              console.log('Stale Service Worker unregistered.');
            });
          }
        });
      }

      // Purge old cache containers to resolve cached UNKNOWN-LAYOUT references
      if ('caches' in window) {
        caches.keys().then((names) => {
          for (const name of names) {
            caches.delete(name).then(() => {
              console.log('Stale cache purged:', name);
            });
          }
        });
      }
    </script>
